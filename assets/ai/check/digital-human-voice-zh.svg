<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 900 720" role="img" aria-label="数字人声音：授权与克隆 checklist">
<rect x="0" y="0" width="900" height="720" fill="#faf7f1"/>
<text x="60" y="64" font-family="IBM Plex Mono, monospace" font-size="16" fill="#84796b">TVCN / CHECK CARD / digital-human-voice</text>
<text x="60" y="112" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#202522">数字人声音：授权与克隆</text>
<text x="60" y="145" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#5f5a52">四项都过，才算完成；只过两项，回到失败点重做。</text>
<rect x="60" y="175" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="221" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="228" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">1</text><text x="136" y="213" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">授权书覆盖声音身份、用途、期限和再训练四项。</text><rect x="60" y="291" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="337" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="344" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">2</text><text x="136" y="329" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">没有书面授权的声音没有被克隆或使用。</text><rect x="60" y="407" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="453" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="460" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">3</text><text x="136" y="445" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">片头和简介都能看到 AI 配音标注。</text>
<text x="60" y="675" font-family="IBM Plex Mono, monospace" font-size="13" fill="#84796b">TVCN · EDITORIAL CHECK CARD · NOT A TEST RECORD</text>
</svg>
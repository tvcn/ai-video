<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 900 720" role="img" aria-label="模型雷达：2026-11 该看哪几个 checklist">
<rect x="0" y="0" width="900" height="720" fill="#faf7f1"/>
<text x="60" y="64" font-family="IBM Plex Mono, monospace" font-size="16" fill="#84796b">TVCN / CHECK CARD / model-radar</text>
<text x="60" y="112" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#202522">模型雷达：2026-11 该看哪几个</text>
<text x="60" y="145" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#5f5a52">四项都过，才算完成；只过两项，回到失败点重做。</text>
<rect x="60" y="175" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="221" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="228" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">1</text><text x="136" y="213" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">七个模型都有版本号、官方链接、地区与日期。</text><rect x="60" y="291" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="337" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="344" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">2</text><text x="136" y="329" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">每个模型至少写 3 个适用镜头、3 个禁用镜头、2 个替代。</text><rect x="60" y="407" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="453" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="460" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">3</text><text x="136" y="445" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">同题测试至少 3 次，记录失败类型而不是只打分。</text><rect x="60" y="523" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="569" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="576" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">4</text><text x="136" y="561" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">页面价格标注“读取日期”，不把渠道价写成官方价。</text>
<text x="60" y="675" font-family="IBM Plex Mono, monospace" font-size="13" fill="#84796b">TVCN · EDITORIAL CHECK CARD · NOT A TEST RECORD</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 900 720" role="img" aria-label="数字人：先解决授权，再解决像 checklist">
<rect x="0" y="0" width="900" height="720" fill="#faf7f1"/>
<text x="60" y="64" font-family="IBM Plex Mono, monospace" font-size="16" fill="#84796b">TVCN / CHECK CARD / digital-human</text>
<text x="60" y="112" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#202522">数字人：先解决授权，再解决像</text>
<text x="60" y="145" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#5f5a52">四项都过，才算完成；只过两项，回到失败点重做。</text>
<rect x="60" y="175" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="221" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="228" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">1</text><text x="136" y="213" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">做一个数字人，要同时解决形象、声音、口型、手势和标注。少一样，观众就会出戏；</text><text x="136" y="239" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">品牌和新闻尤其要慎用。</text><rect x="60" y="291" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="337" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="344" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">2</text><text x="136" y="329" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">主体、动作、光、接点四项都有记录。</text><rect x="60" y="407" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="453" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="460" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">3</text><text x="136" y="445" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">失败类型按时间码回退，不整片重跑。</text><rect x="60" y="523" width="780" height="92" rx="12" fill="#fffdf8" stroke="#d9d1c2"/><circle cx="96" cy="569" r="20" fill="#dfe8e3" stroke="#9aab9e"/><text x="96" y="576" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#486252">4</text><text x="136" y="561" font-family="Noto Sans SC, Arial, sans-serif" font-size="19" fill="#202522">手机/目标平台验收通过。</text>
<text x="60" y="675" font-family="IBM Plex Mono, monospace" font-size="13" fill="#84796b">TVCN · EDITORIAL CHECK CARD · NOT A TEST RECORD</text>
</svg>
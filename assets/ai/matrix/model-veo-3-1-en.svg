<rect x="55" y="175" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="205" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">时长</text><text x="78" y="230" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Duration</text><text x="390" y="204" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">4 / 6 / 8 秒</text><text x="390" y="246" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">4, 6 or 8 seconds</text><rect x="55" y="297" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="327" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">分辨率</text><text x="78" y="352" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Resolution</text><text x="390" y="326" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">720p / 1080p / 4K</text><text x="390" y="368" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">720p, 1080p, 4K</text><rect x="55" y="419" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="449" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">音频</text><text x="78" y="474" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Audio</text><text x="390" y="448" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">原生对白、环境、音效；可关</text><text x="390" y="490" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">Native dialogue, ambience, SFX; can</text><text x="390" y="507" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">disable</text><rect x="55" y="541" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="571" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">公开 API 价格</text><text x="78" y="596" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">List API price</text><text x="390" y="570" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">带音频约</text><text x="390" y="593" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">$0.40/秒（720p/1080p）、$0.60/秒（4K）；Fast/Lite</text><text x="390" y="612" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">About $0.40/s with audio at 720p/1080p,</text><text x="390" y="629" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">$0.60/s at 4K; Fast/Lite lower</text>

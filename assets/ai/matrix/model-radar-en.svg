<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 980 780" role="img" aria-label="Four parameters that decide the job">
<rect x="0" y="0" width="980" height="780" fill="#faf7f1"/>
<text x="55" y="62" font-family="IBM Plex Mono, monospace" font-size="16" fill="#84796b">TVCN / DECISION MATRIX / model-radar</text>
<text x="55" y="110" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#202522">Four parameters that decide the job</text>
<text x="55" y="142" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#5f5a52">Start with delivery, then price; start with failure rate, then resolution.</text>
<rect x="55" y="175" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="205" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">首批覆盖</text><text x="78" y="230" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Coverage</text><text x="390" y="204" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">Veo 3.1 / Kling 3.0 &amp; 4.0 /</text><text x="390" y="227" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">Seedance 2.5 / Wan 3.0 / Runway</text><text x="390" y="246" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">7 candidates, not a ranking</text><rect x="55" y="297" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="327" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">时长</text><text x="78" y="352" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Duration</text><text x="390" y="326" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">4–30 秒，按模型不同</text><text x="390" y="368" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">4–30s depending on model</text><rect x="55" y="419" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="449" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">音频</text><text x="78" y="474" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Audio</text><text x="390" y="448" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">Veo、Kling、Seedance、Wan、H3、Omni</text><text x="390" y="471" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">原生；Runway 需另配</text><text x="390" y="490" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">Native on most; Runway needs separate</text><text x="390" y="507" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">audio</text><rect x="55" y="541" width="870" height="104" rx="10" fill="#fffdf8" stroke="#d9d1c2"/><text x="78" y="571" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#202522">价格口径</text><text x="78" y="596" font-family="Noto Sans SC, Arial, sans-serif" font-size="15" fill="#6f675c">Price</text><text x="390" y="570" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#33433c">按秒/按条/订阅积分三种，不能直接横比</text><text x="390" y="612" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">Per second, per clip or credits; not</text><text x="390" y="629" font-family="Noto Sans SC, Arial, sans-serif" font-size="12.5" fill="#7d756a">directly comparable</text>
<text x="55" y="740" font-family="IBM Plex Mono, monospace" font-size="13" fill="#84796b">TVCN · DECISION CARD · VERIFY PRICE AND AVAILABILITY BEFORE PRODUCTION</text>
</svg>
<rect x="52" y="190" width="206" height="250" rx="16" fill="#f2e8dd" stroke="#c9c2b6" stroke-width="1"/><text x="70" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">01</text><text x="70" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Prepare three refe</text><text x="70" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">rence sets: charac</text><text x="70" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ter, product, set,</text><text x="70" y="337" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522"> each under ten im</text><text x="70" y="362" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ages.</text><path d="M260 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M266 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="276" y="190" width="206" height="250" rx="16" fill="#dfe8e3" stroke="#c9c2b6" stroke-width="1"/><text x="294" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">02</text><text x="294" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Split 30s into 3–4</text><text x="294" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522"> timestamped beats</text><text x="294" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522"> with one action e</text><text x="294" y="337" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ach.</text><path d="M484 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M490 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="500" y="190" width="206" height="250" rx="16" fill="#e3e2f0" stroke="#c9c2b6" stroke-width="1"/><text x="518" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">03</text><text x="518" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Change one region </text><text x="518" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">or timestamp at a </text><text x="518" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">time and preserve </text><text x="518" y="337" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">the rest.</text><path d="M708 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M714 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="724" y="190" width="206" height="250" rx="16" fill="#efe3d7" stroke="#c9c2b6" stroke-width="1"/><text x="742" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">04</text><text x="742" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Use two audio laye</text><text x="742" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">rs first, dialogue</text><text x="742" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522"> and ambience, not</text><text x="742" y="337" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522"> ten clips.</text><path d="M932 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M938 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="948" y="190" width="206" height="250" rx="16" fill="#e8eadf" stroke="#c9c2b6" stroke-width="1"/><text x="966" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">05</text><text x="966" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Cost by usable 30s</text><text x="966" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">, not by one gener</text><text x="966" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ation.</text>

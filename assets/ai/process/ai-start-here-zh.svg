e="#c9c2b6" stroke-width="1"/><text x="742" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">04</text><text x="742" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">每个镜头跑 3 条</text><text x="742" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">，选 1 条进剪辑</text><text x="742" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">。</text><path d="M932 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M938 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="948" y="190" width="206" height="250" rx="16" fill="#e8eadf" stroke="#c9c2b6" stroke-width="1"/><text x="966" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">05</text><text x="966" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">用手机看一遍，再决</text><text x="966" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">定是否继续。</text>

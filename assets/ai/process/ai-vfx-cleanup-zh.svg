<text x="52" y="118" font-family="Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="700" fill="#202522">清理镜头的四步</text>
<text x="52" y="150" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" fill="#5f5a52">把顺序固定下来，再换模型；顺序变了，结果不可比。</text>
<rect x="52" y="190" width="206" height="250" rx="16" fill="#f2e8dd" stroke="#c9c2b6" stroke-width="1"/><text x="70" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">01</text><text x="70" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">先拍/找干净板：同</text><text x="70" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">一机位、同一光。</text><path d="M260 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M266 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="276" y="190" width="206" height="250" rx="16" fill="#dfe8e3" stroke="#c9c2b6" stroke-width="1"/><text x="294" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">02</text><text x="294" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">跟踪镜头运动，画 </text><text x="294" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">roto/遮罩。</text><path d="M484 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M490 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="500" y="190" width="206" height="250" rx="16" fill="#e3e2f0" stroke="#c9c2b6" stroke-width="1"/><text x="518" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">03</text><text x="518" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">先修 10 帧，检</text><text x="518" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">查边缘/纹理/光。</text><path d="M708 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M714 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="724" y="190" width="206" height="250" rx="16" fill="#efe3d7" stroke="#c9c2b6" stroke-width="1"/><text x="742" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">04</text><text x="742" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">再跑整段，分段检查</text><text x="742" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">闪烁。</text><path d="M932 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M938 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="948" y="190" width="206" height="250" rx="16" fill="#e8eadf" stroke="#c9c2b6" stroke-width="1"/><text x="966" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">05</text><text x="966" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">合成回原层，检查颗</text><text x="966" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">粒/色彩/运动模糊</text><text x="966" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">。</text>
<text x="52" y="565" font-family="IBM Plex Mono, monospace" font-size="14" fill="#84796b">TVCN · 2026-11 · AI ILLUSTRATION / NOT A TEST RECORD</text>

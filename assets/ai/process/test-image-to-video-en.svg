amily="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">landing.</text><path d="M708 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M714 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="724" y="190" width="206" height="250" rx="16" fill="#efe3d7" stroke="#c9c2b6" stroke-width="1"/><text x="742" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">04</text><text x="742" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Then references: m</text><text x="742" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ulti-angle charact</text><text x="742" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">er/product, check </text><text x="742" y="337" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">identity.</text><path d="M932 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M938 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="948" y="190" width="206" height="250" rx="16" fill="#e8eadf" stroke="#c9c2b6" stroke-width="1"/><text x="966" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">05</text><text x="966" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">Log identity/compo</text><text x="966" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">sition/motion/land</text><text x="966" y="312" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">ing.</text>

<rect x="52" y="190" width="206" height="250" rx="16" fill="#f2e8dd" stroke="#c9c2b6" stroke-width="1"/><text x="70" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">01</text><text x="70" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">台词改成短句，标逗</text><text x="70" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">号/句号停顿。</text><path d="M260 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M266 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="276" y="190" width="206" height="250" rx="16" fill="#dfe8e3" stroke="#c9c2b6" stroke-width="1"/><text x="294" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">02</text><text x="294" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">数字/缩写写成可读</text><text x="294" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">词，避免读错。</text><path d="M484 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M490 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="500" y="190" width="206" height="250" rx="16" fill="#e3e2f0" stroke="#c9c2b6" stroke-width="1"/><text x="518" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">03</text><text x="518" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">先出无声版锁口型位</text><text x="518" y="287" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#202522">置，再开音频。</text><path d="M708 315 h10" stroke="#8f8577" stroke-width="2"/><path d="M714 310 l10 5 l-10 5" fill="none" stroke="#8f8577" stroke-width="2"/><rect x="724" y="190" width="206" height="250" rx="16" fill="#efe3d7" stroke="#c9c2b6" stroke-width="1"/><text x="742" y="226" font-family="IBM Plex Mono, monospace" font-size="18" fill="#84796b">04</text><text x="742" y="262" font-family="Noto Sans SC, Arial, sans-serif" font-size="17" fill="#20252
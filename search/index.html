<header class="article-hero"><p class="eyebrow">搜索 / TVCN AI Desk</p><h1>搜索全站</h1><p class="article-deck">搜索 29 个中文页。试试“H3”“可灵”“15 秒”“验收”。</p></header>
<div class="ai6-search"><input id="q" type="search" placeholder="搜工具、模型或任务" autocomplete="off" aria-label="搜工具、模型或任务"><button type="button" id="go">搜索</button></div>
<div id="results" class="ai6-search-results"><p class="ai6-footer-note">输入关键词开始。</p></div>
</div>
<script>
(function(){
  var q=document.getElementById('q'), out=document.getElementById('results'), data=null;
  var initial=new URLSearchParams(location.search).get('q');
  if(initial){q.value=initial;}
  function render(){
    if(!data){out.innerHTML='<p class="ai6-footer-note">索引加载失败，请刷新重试。</p>';return;}
    var v=q.value.trim().toLowerCase();
    if(!v){out.innerHTML='<p class="ai6-footer-note">输入关键词开始。</p>';return;}
    var hits=data.filter(function(x){return (x.title+' '+x.desc+' '+x.text+' '+x.section).toLowerCase().indexOf(v)>=0;}).slice(0,20);
    if(!hits.length){out.innerHTML='<p class="ai6-footer-note">没有结果，换一个更宽的关键词。</p>';return;}
    out.innerHTML=hits.map(function(x){return '<div class="ai6-search-result"><span class="ai6-tag">'+x.section+'</span><a href="'+x.path+'">'+x.title+'</a><p>'+x.desc+'</p></div>';}).join('');
  }
  fetch('/search-index.json').then(function(r){return r.json();}).then(function(j){data=j;render();}).catch(function(){data=[];render();});
  q.addEventListener('input',render); document.getElementById('go').addEventListener('click',render);
})();
</script>
